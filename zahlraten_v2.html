<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="title" content="Zahlenraten-Spiel">
		<meta name="description" content="Ein einfaches Zahlenraten Spiel in JavaScript">
		<meta name="keywords" content="Zahlenraten, Spiel, JavaScript, HTML">
		<meta name="author" content="Sasha Kruse">

		<link rel="stylesheet" href="res/styles/main.css">

		<script src="res/js/libs/jquery/jquery-4.0.0-rc.1.js"></script>
		<script src="res/js/main.js"></script>

		<title>Zahlenraten-Spiel</title>
	</head>

	<body>
		<main>
			<div class="desktop">
				<div class="window">
					<div class="window-titlebar">
						<div class="window-titlebar-content">
							<h6>Test</h6>
						</div>

						<div class="window-titlebar-content">
							<button class="titlebar-control">
								<h6>X</h6>
							</button>
						</div>
					</div>

					<div class="window-menubar">
						<div class="menubar-item">
							<div class="menubar-item-button">
								<span>Test</span>
							</div>

							<div class="menubar-dropdown">
								<div class="dropdown-item">
									<span>Test</span>
								</div>

								<div class="dropdown-item">
									<span>Test AAAAAAAAAAAA</span>
								</div>
							</div>
						</div>

						<div class="menubar-item">
							<div class="menubar-item-button">
								<span>Test 2</span>
							</div>

							<div class="menubar-dropdown">
								<div class="dropdown-item">
									<span>AASasdasd</span>
								</div>

								<div class="dropdown-item">
									<span>Test asddsa</span>
								</div>
							</div>
						</div>
					</div>

					<div class="window-content">
						<p>
							<strong>Willkommen</strong>
						</p>

						<p>Test</p>

						<div class="action-buttons">
							<button>
								OK
							</button>

							<button>
								Test
							</button>
						</div>


					</div>
				</div>

				<div class="taskbar">
					<div class="taskbar-start">
						<button>
							<img src="res/img/winlogo.png">

							<span>Start</span>
						</button>

						<div class="start-menu">


							<div class="start-menu-banner">
								<h4>Willkommen!</h4>
							</div>


							<div class="start-menu-items">
								<div class="start-menu-item">
									<img src="res/img/winlogo.png">

									<span>Test</span>
								</div>

								<div class="start-menu-item">
									<img src="res/img/winlogo.png">

									<span>Test 2</span>
								</div>
							</div>
						</div>
					</div>

					<div class="taskbar-items">
						<button class="taskbar-item">
							Test
						</button>
					</div>

					<div class="taskbar-tray">
						<div class="taskbar-clock">
							<span id="tray-clock">12:00</span>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
